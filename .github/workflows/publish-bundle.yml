name: Publish parser bundle

on:
  push:
    branches:
      - master
    paths:
      - 'src/main/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'kotatsu-parsers-ksp/**'
      - '.github/workflows/publish-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bundle
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile and package parser bundle
        run: ./gradlew --no-daemon compileKotlin jar

      - name: Prepare release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" kotatsu-parsers.jar
          sha256="$(sha256sum kotatsu-parsers.jar | cut -d' ' -f1)"
          short_sha="${GITHUB_SHA:0:7}"
          export BUNDLE_SHA256="$sha256"
          export SHORT_SHA="$short_sha"
          previous_sha="$(gh release view latest \
            --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          if [ -n "$previous_sha" ] && \
            git cat-file -e "$previous_sha^{commit}" 2>/dev/null; then
            commit_range="$previous_sha..$GITHUB_SHA"
            changes="$(git log --no-merges \
              --pretty=format:-\ %s\ \(%h\) "$commit_range")"
          else
            changes="$(git log -1 \
              --pretty=format:-\ %s\ \(%h\) "$GITHUB_SHA")"
          fi
          export CHANGES="$changes"
          {
            printf 'PARSER_RELEASE_NAME=%s\n' "Parser Build $short_sha"
            printf 'PARSER_CHANGES<<EOF\n%s\nEOF\n' "$changes"
            printf 'BUNDLE_SHA256=%s\n' "$sha256"
          } >> "$GITHUB_ENV"
          python3 - <<'PY
          import json, os
          sha256 = os.environ["BUNDLE_SHA256"]
          manifest = {
              "version": int(os.environ["GITHUB_RUN_NUMBER"]),
              "apiVersion": 1,
              "minAppVersion": 1,
              "bundleUrl": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  "/releases/download/latest/kotatsu-parsers.jar"
              ),
              "sha256": sha256,
              "commit": os.environ["GITHUB_SHA"],
              "releaseName": f"Parser Build {os.environ['SHORT_SHA']}",
              "changes": os.environ["CHANGES"],
          }
          with open("parser-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Publish parser release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          commit_url="https://github.com/ShiroKazane/kotatsu-parsers/commit/${GITHUB_SHA}"
          gh release delete latest --yes --cleanup-tag || true
          notes=$(cat <<EOF
          ## Changes

          ${PARSER_CHANGES}

          Built from commit [${short_sha}](${commit_url})

          SHA-256
          \`\`\`plaintext
          ${BUNDLE_SHA256}
          \`\`\`
          EOF
          )
          gh release create latest \
            kotatsu-parsers.jar \
            parser-manifest.json \
            --title "Parser Build ${short_sha}" \
            --latest \
            --notes "$notes" \
            --target "$GITHUB_SHA"

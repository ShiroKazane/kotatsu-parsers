name: Publish parser bundle

on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'src/main/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'kotatsu-parsers-ksp/**'
      - '.github/workflows/publish-bundle.yml'
  pull_request:
    paths:
      - 'src/main/kotlin/org/koitharu/kotatsu/parsers/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

concurrency:
  group: parsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile parsers
        run: ./gradlew compileKotlin

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile and package parser bundle
        run: ./gradlew compileKotlin jar

      - name: Add DEX to JAR bundle
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_path"
          mkdir -p bundle-dex
          d8 --lib "$ANDROID_HOME/platforms/android-36/android.jar" \
            --output bundle-dex "$jar_path"
          zip -q -j "$jar_path" bundle-dex/classes.dex

      - name: Prepare release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f \
            -name "*.jar" ! -name "*-plain.jar" -print -quit)"
          test -n "$jar_path"
          cp "$jar_path" kotatsu-parsers.jar
          sha256="$(sha256sum kotatsu-parsers.jar | cut -d' ' -f1)"
          short_sha="${GITHUB_SHA:0:7}"
          export BUNDLE_SHA256="$sha256"
          export SHORT_SHA="$short_sha"
          previous_sha="$(gh release view latest \
            --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          commit_base="https://github.com/ShiroKazane/kotatsu-parsers/commit"
          if [ -n "$previous_sha" ] && \
            git cat-file -e "$previous_sha^{commit}" 2>/dev/null; then
            commit_range="$previous_sha..$GITHUB_SHA"
            changes="$(git log --no-merges --abbrev=7 \
              --pretty=format:"- %s ([%h]($commit_base/%H))" \
              "$commit_range")"
          else
            changes="$(git log -1 --abbrev=7 \
              --pretty=format:"- %s ([%h]($commit_base/%H))" \
              "$GITHUB_SHA")"
          fi
          export CHANGES="$changes"
          {
            printf 'PARSER_RELEASE_NAME=%s\n' "Parser Build $short_sha"
            printf 'PARSER_CHANGES<<EOF\n%s\nEOF\n' "$changes"
            printf 'BUNDLE_SHA256=%s\n' "$sha256"
          } >> "$GITHUB_ENV"
          jq -n \
            --argjson version "$GITHUB_RUN_NUMBER" \
            --arg bundleUrl "https://github.com/$GITHUB_REPOSITORY" \
            --arg bundlePath "/releases/download/latest/kotatsu-parsers.jar" \
            --arg sha256 "$sha256" \
            --arg commit "$GITHUB_SHA" \
            --arg releaseName "Parser Build $short_sha" \
            --arg changes "$changes" \
            '{version: $version, apiVersion: 1, minAppVersion: 1,
              bundleUrl: ($bundleUrl + $bundlePath), sha256: $sha256,
              commit: $commit, releaseName: $releaseName,
              changes: $changes}' \
            > parser-manifest.json

      - name: Publish parser release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          commit_url="https://github.com/ShiroKazane/kotatsu-parsers/commit/${GITHUB_SHA}"
          gh release delete latest --yes --cleanup-tag || true
          notes=$(cat <<EOF
          ## Changes

          ${PARSER_CHANGES}

          Built from commit [${short_sha}](${commit_url})

          SHA-256
          \`\`\`plaintext
          ${BUNDLE_SHA256}
          \`\`\`
          EOF
          )
          for attempt in 1 2 3 4 5; do
            gh release create latest \
              kotatsu-parsers.jar \
              parser-manifest.json \
              --title "Parser Build ${short_sha}" \
              --latest \
              --notes "$notes" \
              --target "$GITHUB_SHA" && break
            sleep 20
          done
          gh release view latest

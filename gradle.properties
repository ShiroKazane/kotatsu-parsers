## Following this blog:
# https://proandroiddev.com/how-we-reduced-our-gradle-build-times-by-over-80-51f2b6d6b05b
kotlin.code.style=official
systemProp.org.gradle.unsafe.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.workers.max=3
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m
